<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Download = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const Upload = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const Settings = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m0-18l-3 3m6 0l-3-3m-6 9h6m6 0h6m-18 0l3 3m0-6l-3 3"></path>
            </svg>
        );

        const RefreshCw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        function ExpenseTracker() {
            const [transactions, setTransactions] = useState([]);
            const [category, setCategory] = useState('');
            const [type, setType] = useState('Expense');
            const [amount, setAmount] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [showForm, setShowForm] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [sheetUrl, setSheetUrl] = useState(localStorage.getItem('sheetUrl') || '');
            const [isConnected, setIsConnected] = useState(!!localStorage.getItem('sheetUrl'));
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSync, setLastSync] = useState(localStorage.getItem('lastSync') || null);

            useEffect(() => {
                const saved = localStorage.getItem('expenseData');
                if (saved) {
                    setTransactions(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                if (transactions.length > 0) {
                    localStorage.setItem('expenseData', JSON.stringify(transactions));
                }
            }, [transactions]);

            const saveSheetUrl = () => {
                if (sheetUrl.trim()) {
                    localStorage.setItem('sheetUrl', sheetUrl.trim());
                    setIsConnected(true);
                    alert('✅ Google Sheet connected! Your data will now sync automatically.');
                    setShowSettings(false);
                } else {
                    alert('Please enter a valid URL');
                }
            };

            const disconnectSheet = () => {
                if (confirm('Disconnect from Google Sheet? (Your local data will remain safe)')) {
                    localStorage.removeItem('sheetUrl');
                    setSheetUrl('');
                    setIsConnected(false);
                    alert('Disconnected from Google Sheet');
                }
            };

            const syncToSheet = async (newTransaction = null) => {
                const url = localStorage.getItem('sheetUrl');
                if (!url) return;

                setIsSyncing(true);
                try {
                    const dataToSync = newTransaction || transactions[transactions.length - 1];
                    if (!dataToSync) return;

                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(dataToSync)
                    });

                    const now = new Date().toLocaleString('en-IN');
                    setLastSync(now);
                    localStorage.setItem('lastSync', now);
                } catch (error) {
                    console.error('Sync error:', error);
                    alert('⚠️ Could not sync to Google Sheet. Check your URL and try again.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const addTransaction = async () => {
                if (!category || !amount) {
                    alert('Please fill in category and amount');
                    return;
                }

                const newTransaction = {
                    id: Date.now(),
                    category,
                    type,
                    amount: parseFloat(amount),
                    date
                };

                setTransactions([...transactions, newTransaction]);
                
                if (isConnected) {
                    await syncToSheet(newTransaction);
                }

                setCategory('');
                setAmount('');
                setDate(new Date().toISOString().split('T')[0]);
                setShowForm(false);
            };

            const deleteTransaction = (id) => {
                if (confirm('Delete this transaction?')) {
                    setTransactions(transactions.filter(t => t.id !== id));
                }
            };

            const exportToCSV = () => {
                const headers = ['Category', 'Type', 'Amount', 'Date'];
                const rows = transactions.map(t => [t.category, t.type, t.amount, t.date]);
                
                const csv = [
                    headers.join(','),
                    ...rows.map(row => row.join(','))
                ].join('\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `expenses_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const importFromCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const rows = text.split('\n').slice(1);
                    
                    const imported = rows
                        .filter(row => row.trim())
                        .map(row => {
                            const [category, type, amount, date] = row.split(',');
                            return {
                                id: Date.now() + Math.random(),
                                category: category?.trim() || '',
                                type: type?.trim() || 'Expense',
                                amount: parseFloat(amount) || 0,
                                date: date?.trim() || new Date().toISOString().split('T')[0]
                            };
                        });

                    setTransactions([...transactions, ...imported]);
                    alert(`Imported ${imported.length} transactions!`);
                };
                reader.readAsText(file);
            };

            const totalExpenses = transactions
                .filter(t => t.type === 'Expense')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalSavings = transactions
                .filter(t => t.type === 'Save')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalLiabilities = transactions
                .filter(t => t.type === 'Liability')
                .reduce((sum, t) => sum + t.amount, 0);

            const commonCategories = [
                'Groceries', 'Milk', 'House Maintenance', 'Powerbill', 'Gas Bill',
                'Vegetables', 'fruits','Stationery','Outside food','Personal'
        
            ];

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 mb-2">💰 Expense Tracker</h1>
                                    <p className="text-gray-600 text-sm">Track expenses with Google Sheets sync!</p>
                                </div>
                                <button
                                    onClick={() => setShowSettings(!showSettings)}
                                    className="p-3 bg-gray-100 rounded-xl hover:bg-gray-200 active:scale-95 transition"
                                    title="Settings"
                                >
                                    <Settings size={24} />
                                </button>
                            </div>
                            
                            {isConnected && (
                                <div className="mt-4 bg-green-50 border border-green-200 rounded-lg p-3 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="text-green-600 font-semibold">✓ Connected to Google Sheet</span>
                                        {isSyncing && <span className="text-sm text-gray-600">(Syncing...)</span>}
                                    </div>
                                    {lastSync && <span className="text-xs text-gray-600">Last sync: {lastSync}</span>}
                                </div>
                            )}
                        </div>

                        {showSettings && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">⚙️ Google Sheets Settings</h2>
                                
                                {!isConnected ? (
                                    <>
                                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4 text-sm text-blue-900">
                                            <p className="font-semibold mb-2">📋 Setup Instructions:</p>
                                            <ol className="list-decimal ml-4 space-y-1">
                                                <li>Create a new Google Sheet</li>
                                                <li>Go to Extensions → Apps Script</li>
                                                <li>Paste the setup code (see below)</li>
                                                <li>Deploy as Web App</li>
                                                <li>Copy the URL and paste it here</li>
                                            </ol>
                                        </div>

                                        <div className="mb-4">
                                            <label className="text-sm font-semibold text-gray-700 mb-2 block">
                                                Web App URL
                                            </label>
                                            <input
                                                type="text"
                                                value={sheetUrl}
                                                onChange={(e) => setSheetUrl(e.target.value)}
                                                placeholder="https://script.google.com/macros/s/..."
                                                className="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:border-indigo-500 focus:outline-none"
                                            />
                                        </div>

                                        <button
                                            onClick={saveSheetUrl}
                                            className="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-lg active:scale-95 transition"
                                        >
                                            Connect Google Sheet
                                        </button>
                                    </>
                                ) : (
                                    <div>
                                        <div className="mb-4 p-3 bg-gray-50 rounded-lg">
                                            <p className="text-sm text-gray-600 mb-1">Connected URL:</p>
                                            <p className="text-xs text-gray-800 break-all font-mono">{sheetUrl}</p>
                                        </div>
                                        <button
                                            onClick={disconnectSheet}
                                            className="w-full bg-red-500 text-white py-3 rounded-xl font-semibold shadow-lg active:scale-95 transition"
                                        >
                                            Disconnect
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="grid grid-cols-3 gap-3 mb-4">
                            <div className="bg-red-500 rounded-xl shadow-lg p-4 text-white">
                                <div className="text-xs opacity-90 mb-1">Expenses</div>
                                <div className="text-xl font-bold">₹{totalExpenses.toLocaleString()}</div>
                            </div>
                            <div className="bg-green-500 rounded-xl shadow-lg p-4 text-white">
                                <div className="text-xs opacity-90 mb-1">Savings</div>
                                <div className="text-xl font-bold">₹{totalSavings.toLocaleString()}</div>
                            </div>
                            <div className="bg-blue-500 rounded-xl shadow-lg p-4 text-white">
                                <div className="text-xs opacity-90 mb-1">Liabilities</div>
                                <div className="text-xl font-bold">₹{totalLiabilities.toLocaleString()}</div>
                            </div>
                        </div>

                        <div className="flex gap-2 mb-4">
                            <button
                                onClick={() => setShowForm(!showForm)}
                                className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-semibold shadow-lg flex items-center justify-center gap-2 active:scale-95 transition"
                            >
                                <Plus size={24} />
                                Add Transaction
                            </button>
                            <button
                                onClick={exportToCSV}
                                className="bg-white text-gray-700 px-4 py-4 rounded-xl shadow-lg active:scale-95 transition"
                                title="Export to CSV"
                            >
                                <Download size={24} />
                            </button>
                            <label className="bg-white text-gray-700 px-4 py-4 rounded-xl shadow-lg active:scale-95 transition cursor-pointer">
                                <Upload size={24} />
                                <input
                                    type="file"
                                    accept=".csv"
                                    onChange={importFromCSV}
                                    className="hidden"
                                />
                            </label>
                        </div>

                        {showForm && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Add New Transaction</h2>
                                
                                <div className="mb-4">
                                    <label className="text-sm font-semibold text-gray-700 mb-2 block">Quick Select</label>
                                    <div className="flex flex-wrap gap-2">
                                        {commonCategories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setCategory(cat)}
                                                className={`px-3 py-1 rounded-lg text-sm ${
                                                    category === cat
                                                        ? 'bg-indigo-600 text-white'
                                                        : 'bg-gray-100 text-gray-700'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <label className="text-sm font-semibold text-gray-700 mb-2 block">Category</label>
                                    <input
                                        type="text"
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        placeholder="Enter category name"
                                        className="w-full p-4 border-2 border-gray-200 rounded-xl text-lg focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>

                                <div className="mb-4">
                                    <label className="text-sm font-semibold text-gray-700 mb-2 block">Type</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['Expense', 'Save', 'Liability'].map(t => (
                                            <button
                                                key={t}
                                                onClick={() => setType(t)}
                                                className={`py-3 rounded-xl font-semibold ${
                                                    type === t
                                                        ? t === 'Expense'
                                                            ? 'bg-red-500 text-white'
                                                            : t === 'Save'
                                                            ? 'bg-green-500 text-white'
                                                            : 'bg-blue-500 text-white'
                                                        : 'bg-gray-100 text-gray-700'
                                                }`}
                                            >
                                                {t}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <label className="text-sm font-semibold text-gray-700 mb-2 block">Amount (₹)</label>
                                    <input
                                        type="number"
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="0"
                                        className="w-full p-4 border-2 border-gray-200 rounded-xl text-lg focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>

                                <div className="mb-4">
                                    <label className="text-sm font-semibold text-gray-700 mb-2 block">Date</label>
                                    <input
                                        type="date"
                                        value={date}
                                        onChange={(e) => setDate(e.target.value)}
                                        className="w-full p-4 border-2 border-gray-200 rounded-xl text-lg focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>

                                <div className="flex gap-2">
                                    <button
                                        onClick={addTransaction}
                                        className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-semibold shadow-lg active:scale-95 transition"
                                    >
                                        Add Transaction
                                    </button>
                                    <button
                                        onClick={() => setShowForm(false)}
                                        className="px-6 bg-gray-200 text-gray-700 py-4 rounded-xl font-semibold active:scale-95 transition"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">Recent Transactions</h2>
                            
                            {transactions.length === 0 ? (
                                <div className="text-center py-12 text-gray-400">
                                    <p className="text-lg mb-2">No transactions yet</p>
                                    <p className="text-sm">Tap "Add Transaction" to get started!</p>
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {transactions
                                        .sort((a, b) => new Date(b.date) - new Date(a.date))
                                        .map(transaction => (
                                            <div
                                                key={transaction.id}
                                                className={`flex items-center justify-between p-4 rounded-xl border-l-4 ${
                                                    transaction.type === 'Expense'
                                                        ? 'bg-red-50 border-red-500'
                                                        : transaction.type === 'Save'
                                                        ? 'bg-green-50 border-green-500'
                                                        : 'bg-blue-50 border-blue-500'
                                                }`}
                                            >
                                                <div className="flex-1">
                                                    <div className="font-semibold text-gray-800">{transaction.category}</div>
                                                    <div className="text-sm text-gray-600">
                                                        {transaction.type} • {new Date(transaction.date).toLocaleDateString('en-IN')}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-xl font-bold text-gray-800">
                                                        ₹{transaction.amount.toLocaleString()}
                                                    </div>
                                                    <button
                                                        onClick={() => deleteTransaction(transaction.id)}
                                                        className="text-red-500 p-2 hover:bg-red-100 rounded-lg active:scale-95 transition"
                                                    >
                                                        <Trash2 size={20} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-4 bg-indigo-100 rounded-xl p-4 text-sm text-indigo-900">
                            <p className="font-semibold mb-1">📱 Features:</p>
                            <p>• Auto-sync to Google Sheets when connected</p>
                            <p>• Local storage backup on your device</p>
                            <p>• Export/Import CSV for Excel/Sheets</p>
                            <p>• Works offline, syncs when online</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ExpenseTracker />, document.getElementById('root'));
    </script>
</body>
</html>
